# apps/web/nginx.conf : menyajikan React dan meneruskan /api ke container api
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # rute React Router (/masuk, /petugas, ...) dikembalikan ke index.html
    location / {
        try_files $uri /index.html;
    }
}
